name: Deploy Dist
on: [push, workflow_dispatch]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Get code
        uses: actions/checkout@v7
      - name: Install Node 20
        uses: actions/setup-node@v7
        with:
          node-version: 20
      - name: Install Dependencies
        run: npm ci
      - name: Run Tests
        run: npm run test
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Get Code
        uses: actions/checkout@v7
      - name: Install Node 20
        uses: actions/setup-node@v7
        with:
          node-version: 20
      - name: Install Dependencies
        run: npm cli
      - name: Build Project
        run: npm run build
      - name: Deploy
        run: echo "Deploy successful"
        
